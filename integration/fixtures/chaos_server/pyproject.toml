[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chaos_server"
version = "1.1"
description = "Project initialized by h2pcontrol cli"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.11, <4.0"
dependencies = [
  "betterproto2==0.4.0",
  "betterproto2-compiler==0.4.0",
  "chaos-server-proto",
  "grpcio>=1.83.0",
  "grpclib>=0.4.8",
  "protobuf>=7.35.1",
]

[tool.uv.sources]
chaos-server-proto = { path = "proto_packages/chaos_server_proto", editable = true }
