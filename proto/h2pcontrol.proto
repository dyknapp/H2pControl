syntax = "proto3";

option go_package = "h2pcontrol.manager";
option java_multiple_files = true;
option java_package = "io.h2pcontrol.client";
option java_outer_classname = "h2pcontrol";

package h2pcontrol;


service Manager {
  rpc GetStub(StubRequest) returns (StubResponse);
  rpc RegisterServer(RegisterRequest) returns (RegisterResponse);
  rpc UnregisterServer(UnregisterServerRequest) returns (Empty);
  rpc Heartbeat(stream HeartbeatPing) returns (stream HeartbeatPong);

  rpc FetchServers(Empty) returns (FetchServersResponse);
  rpc FetchSpecificServer(FetchSpecificServerRequest) returns (FetchSpecificServerResponse);
}

message Empty {}


message HeartbeatPing {
  string registration_id = 1;
  int64 timestamp = 2;
}

message HeartbeatPong {
  bool healthy = 1;
  int64 timestamp = 3;
}

message ServerDefinition {
  string server_name = 1;
  string advertised_host = 2;
  string port = 3;
  string version = 4;
  repeated File proto_files = 5;
}


message RegisterRequest {
  ServerDefinition server = 1;
}

message RegisterResponse {
  string result = 1;
  string registration_id = 2;
  string proto_sha256 = 3;
}

message UnregisterServerRequest {
  string registration_id = 1;
}

message FetchServerDefinition {
  string name = 1;
  string description = 2;
  string addr = 3;
}

message FetchServersResponse {
  repeated FetchServerDefinition servers = 1; 
}

message FetchSpecificServerRequest {
  string addr = 1;
}

message FetchSpecificServerResponse {
  FetchServerDefinition server_definition = 1;
  string proto = 2;
}


message StubRequest {
  string server_name = 1;
  string version = 2;
  string language = 3; // e.g., "python", "java".  Only Python is supported at the moment.
}


message StubResponse {
  string filename = 1;
  bytes wheel_data = 2;
  string wheel_sha256 = 3;
  string proto_sha256 = 4;
}

message File {
  string name = 1;
  bytes content = 2;
}

