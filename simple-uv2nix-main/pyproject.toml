[project]
name = "uv2nix-template"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = [
    "setuptools",
    "artiq @ git+https://github.com/m-labs/artiq.git",
    "sipyco @ git+https://github.com/m-labs/sipyco.git",
    "pythonparser @ git+https://github.com/m-labs/pythonparser.git",
    "numpy>=1.20.0",
    "llvmlite>=0.44.0",
    "PyQt6>=6.4.0"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
