[project]
name = "uv2nix-template"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = [
    "setuptools",
    "artiq @ git+https://github.com/m-labs/artiq.git",
    "sipyco @ git+https://github.com/m-labs/sipyco.git",
 "pythonparser @ git+https://github.com/m-labs/pythonparser.git",
    "numpy>=1.20.0",
    "llvmlite>=0.44.0",
    # PySide6 or PySide6-Essentials or PyQt6
    "PyQt6 >= 6.0.0",
    # "PyQt6 == 6.8.0", # compatible with nixpkgs.qt6.full v6.8.1
    "PySide6-Essentials >= 6.0.0",
    # "PySide6-Essentials == 6.8.1", # compatible with nixpkgs.qt6.full v6.8.1
]

# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#dependencies-optional-dependencies
[project.optional-dependencies]
PySide6-Essentials = [
  "PySide6-Essentials >= 6.0.0",
]
PyQt6 = [
  "PyQt6 >= 6.0.0",
]


name = "uv2nix-template"
version = "0.1.0"
requires-python = ">=3.10,<3.12"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
